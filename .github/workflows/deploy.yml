
name: GoldStore CI-CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldstore-deployment
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: [self-hosted, Windows, X64, goldstore]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check .NET SDK
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore GoldStoreSolution.sln

      - name: Build solution
        run: dotnet build GoldStoreSolution.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test GoldStoreSolution.sln -c Release --no-build

      - name: Publish GoldStore
        run: dotnet publish GoldStore.Web/GoldStore.Web.csproj -c Release --self-contained false -o "%RUNNER_TEMP%\GoldStore-Publish-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
